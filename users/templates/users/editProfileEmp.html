{% extends 'base.html' %}
{% load static %}

{% block content %}
<h2>Editar Perfil Empresa</h2>

<form method="post" novalidate>
    {% csrf_token %}
    <fieldset>
        <legend>Información de Usuario</legend>
        {{ user_form.as_p }}
    </fieldset>
    <fieldset>
        <legend>Información de la Empresa</legend>
        {{ profile_form.as_p }}
    </fieldset>
    <button type="submit">Guardar Cambios</button>
</form>
{% endblock %}
