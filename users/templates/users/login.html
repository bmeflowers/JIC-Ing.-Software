{% extends "base.html" %}
{% load static %}

{% block title %}Iniciar Sesión - Mi Plataforma de Prácticas{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <h2 class="login-title">Iniciar Sesión</h2>

        <form method="post" class="login-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="login-button">Entrar</button>
        </form>

        <div class="register-links">
            <p>¿No tienes una cuenta?</p>
            <ul>
                <li><a href="{% url 'registroEstudiante' %}">Registrarse como Estudiante</a></li>
                <li><a href="{% url 'registroEmpresa' %}">Registrarse como Empresa</a></li>
            </ul>
        </div>
    </div>
</div>
{% endblock %}
