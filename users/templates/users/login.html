{% extends "base.html" %}
{% load static %}

{% block title %}Iniciar Sesión{% endblock %}

{% block content %}
<h2>Iniciar Sesión</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Entrar</button>
</form>

<p>¿No tienes una cuenta?</p>
<ul>
    <li><a href="{% url 'registroEstudiante' %}">Registrarse como Estudiante</a></li>
    <li><a href="{% url 'registroEmpresa' %}">Registrarse como Empresa</a></li>
</ul>
{% endblock %}
